[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-transcribe"
version = "0.1.0"
description = "Transcript extraction for YouTube and audio sources"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.1",
  "yt-dlp>=2025.2.19"
]

[project.scripts]
media-transcribe = "media_transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_transcribe"]
